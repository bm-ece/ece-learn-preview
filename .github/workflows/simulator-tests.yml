name: Simulator regression tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing simulator and migration tests
        run: node tests/simulator.test.cjs
      - name: Interactive commands and seven laboratories
        run: node tests/command-matrix.test.cjs

      - name: All 79 lesson renderings and persistence
        run: node tests/lessons.test.cjs
