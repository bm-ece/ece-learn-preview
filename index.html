<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#091528">
  <title>ECE Learn · Votre espace d'apprentissage interactif</title>
  <meta name="description" content="ECE Learn : votre espace d'apprentissage interactif pour ING1, ING2 et ING3.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body>
  <header><div class="brand"><img src="assets/ece-logo.jpg" alt="Logo ECE" width="54" height="54"><div><h1>ECE Learn</h1><p>Votre espace d'apprentissage interactif</p></div></div></header>
  <main>
    <section class="intro"><h2>Choisissez votre niveau</h2><p>Retrouvez les matières correspondant à votre année d'études.</p><div class="level-label" id="level-label">Votre niveau</div><div class="level-options" role="group" aria-labelledby="level-label"><button type="button" class="level-option" data-level="ING1" aria-pressed="false">ING1</button><button type="button" class="level-option" data-level="ING2" aria-pressed="false">ING2</button><button type="button" class="level-option" data-level="ING3" aria-pressed="false">ING3</button></div></section>
    <section aria-label="Matières correspondant au niveau"><h2 class="courses-title">Mes matières</h2><p id="course-message" role="status" aria-live="polite"></p><div class="courses" id="courses"></div></section>
  </main>
  <footer>ECE Learn · ECE Engineering School · <a href="https://www.ece.fr/" rel="noopener noreferrer" target="_blank">ece.fr</a></footer>
  <script src="js/catalog.js"></script>
  <script src="js/portal.js"></script>
